<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate AI Quiz - AdaptQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#4f46e5', dark: '#111827' } } } }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark dark:text-gray-100 transition-colors duration-200">
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <main class="md:ml-64 pt-6 px-6 flex justify-center mt-10">
        <div class="w-full max-w-2xl bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border-t-4 border-primary">
            <h1 class="text-3xl font-bold mb-6 text-center">Generate AI Quiz</h1>
            <p class="text-center text-gray-500 mb-8">Customize the difficulty and length to generate a personalized adaptive quiz from your notes.</p>
            
            <form id="generate-form" class="space-y-6">
                <div>
                    <label class="block mb-2 font-medium">Difficulty Level</label>
                    <select id="difficulty" class="w-full px-4 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 focus:ring-primary focus:border-primary">
                        <option value="Easy">Easy</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                
                <div>
                    <label class="block mb-2 font-medium">Number of Questions</label>
                    <input type="number" id="question_count" value="10" min="5" max="50" class="w-full px-4 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 focus:ring-primary focus:border-primary">
                </div>
                
                <div class="flex items-center">
                    <input type="checkbox" id="adaptive" class="mr-2 rounded text-primary focus:ring-primary w-5 h-5">
                    <label class="font-medium">Enable Adaptive Mode (Questions scale in difficulty based on your answers)</label>
                </div>

                <button type="submit" id="generate-btn" class="w-full bg-primary text-white py-3 rounded-md hover:bg-indigo-600 transition font-bold text-lg shadow-md disabled:bg-gray-400 disabled:cursor-not-allowed">Generate AI Quiz</button>
            </form>
        </div>
    </main>

    <script type="module" src="/src/js/components.js"></script>
    <script>
        // Get note_id from query params
        const urlParams = new URLSearchParams(window.location.search);
        const noteId = urlParams.get('note_id');
        
        if(!noteId) {
            alert("No note selected. Redirecting to Library.");
            window.location.href = '/src/pages/notes/library.html';
        }

        document.getElementById('generate-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('access_token');
            if(!token) { window.location.href = '/src/pages/auth/login.html'; return; }

            const difficulty = document.getElementById('difficulty').value;
            const count = parseInt(document.getElementById('question_count').value);
            const adaptive = document.getElementById('adaptive').checked;

            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btn.textContent = "AI is Generating Quiz...";

            try {
                const response = await fetch('/api/v1/quiz/generate', {
                    method: 'POST',
                    headers: { 
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        note_id: parseInt(noteId),
                        difficulty: difficulty,
                        question_count: count,
                        is_adaptive: adaptive
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    window.location.href = 'attempt.html?quiz_id=' + data.id;
                } else {
                    const error = await response.json();
                    alert('Generation failed: ' + error.detail);
                }
            } catch (err) {
                alert('Error connecting to server.');
            } finally {
                btn.disabled = false;
                btn.textContent = "Generate AI Quiz";
            }
        });
    </script>
</body>
</html>
