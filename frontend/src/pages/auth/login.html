<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AdaptQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#4f46e5', dark: '#111827' } } } }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark dark:text-gray-100 transition-colors duration-200">
    <div id="navbar-container"></div>

    <div class="container mx-auto mt-20 flex justify-center px-4">
        <div class="w-full max-w-md bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg">
            <h2 class="text-3xl font-bold mb-6 text-center text-primary">Welcome Back</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block mb-1 font-medium">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 focus:ring-primary focus:border-primary">
                </div>
                <div>
                    <label class="block mb-1 font-medium">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 focus:ring-primary focus:border-primary">
                </div>
                <div class="flex justify-between items-center text-sm">
                    <label class="flex items-center">
                        <input type="checkbox" class="mr-2 rounded text-primary focus:ring-primary"> Remember me
                    </label>
                    <a href="forgot-password.html" class="text-primary hover:underline">Forgot password?</a>
                </div>
                <button type="submit" class="w-full bg-primary text-white py-2 rounded-md hover:bg-indigo-600 transition font-semibold">Login</button>
            </form>
            <p class="mt-6 text-center text-gray-600 dark:text-gray-400">
                Don't have an account? <a href="register.html" class="text-primary hover:underline">Sign up</a>
            </p>
        </div>
    </div>

    <script type="module" src="/src/js/components.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);
                
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    window.location.href = '/src/pages/student/dashboard.html';
                } else {
                    alert('Login failed: ' + data.detail);
                }
            } catch (err) {
                alert('Error connecting to server.');
            }
        });
    </script>
</body>
</html>
