<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Note - AdaptQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#4f46e5', dark: '#111827' } } } }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark dark:text-gray-100 transition-colors duration-200">
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <main class="md:ml-64 pt-6 px-6 flex justify-center mt-10">
        <div class="w-full max-w-2xl bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border-t-4 border-primary">
            <h1 class="text-3xl font-bold mb-6 text-center">Upload Study Material</h1>
            <p class="text-center text-gray-500 mb-8">Upload a PDF or TXT file to automatically generate quizzes, flashcards, and concept maps.</p>
            
            <form id="upload-form" class="space-y-6">
                <div class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-10 text-center hover:bg-gray-50 dark:hover:bg-gray-700 transition cursor-pointer" id="drop-zone">
                    <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="text-gray-600 dark:text-gray-400 mb-2">Drag and drop your file here, or click to browse</p>
                    <input type="file" id="file-input" class="hidden" accept=".pdf,.txt">
                    <button type="button" class="mt-4 px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded shadow hover:bg-gray-300 dark:hover:bg-gray-500" onclick="document.getElementById('file-input').click()">Select File</button>
                    <p id="file-name" class="mt-4 text-sm text-primary font-semibold"></p>
                </div>
                
                <button type="submit" id="upload-btn" class="w-full bg-primary text-white py-3 rounded-md hover:bg-indigo-600 transition font-bold text-lg shadow-md disabled:bg-gray-400 disabled:cursor-not-allowed">Upload & Process</button>
            </form>
            <div id="status-msg" class="mt-4 text-center font-semibold text-green-600 hidden">Upload complete! Processing AI features...</div>
        </div>
    </main>

    <script type="module" src="/src/js/components.js"></script>
    <script>
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name');
        
        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                fileNameDisplay.textContent = 'Selected: ' + e.target.files[0].name;
            }
        });

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(fileInput.files.length === 0) {
                alert("Please select a file first.");
                return;
            }

            const token = localStorage.getItem('access_token');
            if(!token) { window.location.href = '/src/pages/auth/login.html'; return; }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const btn = document.getElementById('upload-btn');
            btn.disabled = true;
            btn.textContent = "Uploading...";

            try {
                const response = await fetch('/api/v1/notes/upload', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                
                if (response.ok) {
                    document.getElementById('status-msg').classList.remove('hidden');
                    setTimeout(() => window.location.href = 'library.html', 2000);
                } else {
                    let errorMessage = 'Upload failed.';
                    try {
                        const error = await response.json();
                        errorMessage += ' ' + (error.detail || '');
                    } catch (e) {
                        if (response.status === 413) {
                            errorMessage = 'Upload failed: File is too large (exceeds server limit).';
                        } else {
                            errorMessage += ` HTTP Error ${response.status}`;
                        }
                    }
                    alert(errorMessage);
                }
            } catch (err) {
                console.error(err);
                alert('Error connecting to server. Please check your connection.');
            } finally {
                btn.disabled = false;
                btn.textContent = "Upload & Process";
            }
        });
    </script>
</body>
</html>
