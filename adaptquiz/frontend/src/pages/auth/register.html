<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AdaptQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#4f46e5', dark: '#111827' } } } }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark dark:text-gray-100 transition-colors duration-200">
    <div id="navbar-container"></div>

    <div class="container mx-auto mt-20 flex justify-center px-4">
        <div class="w-full max-w-md bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg">
            <h2 class="text-3xl font-bold mb-6 text-center text-primary">Create an Account</h2>
            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block mb-1 font-medium">Role</label>
                    <select id="role" class="w-full px-4 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 focus:ring-primary focus:border-primary">
                        <option value="STUDENT">Student</option>
                        <option value="TEACHER">Teacher</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1 font-medium">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 focus:ring-primary focus:border-primary">
                </div>
                <div>
                    <label class="block mb-1 font-medium">Password</label>
                    <input type="password" id="password" required minlength="8" class="w-full px-4 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 focus:ring-primary focus:border-primary">
                </div>
                <button type="submit" class="w-full bg-primary text-white py-2 rounded-md hover:bg-indigo-600 transition font-semibold">Sign Up</button>
            </form>
            <p class="mt-6 text-center text-gray-600 dark:text-gray-400">
                Already have an account? <a href="login.html" class="text-primary hover:underline">Login</a>
            </p>
        </div>
    </div>

    <script type="module" src="/src/js/components.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });
                
                const data = await response.json();
                if (response.ok) {
                    alert('Registration successful! Please login.');
                    window.location.href = 'login.html';
                } else {
                    alert('Registration failed: ' + (data.detail || 'Unknown error'));
                }
            } catch (err) {
                alert('Error connecting to server.');
            }
        });
    </script>
</body>
</html>
