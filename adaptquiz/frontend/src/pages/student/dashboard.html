<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AdaptQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#4f46e5', dark: '#111827' } } } }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark dark:text-gray-100 transition-colors duration-200">
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <main class="md:ml-64 pt-6 px-6">
        <h1 class="text-3xl font-bold mb-6">Student Dashboard</h1>
        
        <!-- Dashboard Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border-l-4 border-primary">
                <p class="text-sm text-gray-500 dark:text-gray-400">Total Quizzes</p>
                <p class="text-2xl font-bold" id="total-quizzes">12</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border-l-4 border-secondary">
                <p class="text-sm text-gray-500 dark:text-gray-400">Avg. Accuracy</p>
                <p class="text-2xl font-bold" id="avg-accuracy">84%</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border-l-4 border-yellow-500">
                <p class="text-sm text-gray-500 dark:text-gray-400">Learning Streak</p>
                <p class="text-2xl font-bold" id="learning-streak">5 Days</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border-l-4 border-red-500">
                <p class="text-sm text-gray-500 dark:text-gray-400">Pending Revisions</p>
                <p class="text-2xl font-bold" id="pending-revisions">3 Topics</p>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
                <h3 class="text-xl font-bold mb-4">Accuracy Trend</h3>
                <canvas id="accuracyChart"></canvas>
            </div>
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
                <h3 class="text-xl font-bold mb-4">Topic Mastery</h3>
                <canvas id="masteryChart"></canvas>
            </div>
        </div>
    </main>

    <script type="module" src="/src/js/components.js"></script>
    <script>
        // Check auth
        if (!localStorage.getItem('access_token')) {
            window.location.href = '/src/pages/auth/login.html';
        }

        // Initialize Charts with dummy data for now
        const ctxAccuracy = document.getElementById('accuracyChart').getContext('2d');
        new Chart(ctxAccuracy, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Accuracy %',
                    data: [65, 70, 80, 81, 85, 84, 88],
                    borderColor: '#4f46e5',
                    tension: 0.4
                }]
            }
        });

        const ctxMastery = document.getElementById('masteryChart').getContext('2d');
        new Chart(ctxMastery, {
            type: 'radar',
            data: {
                labels: ['Biology', 'Physics', 'History', 'Math', 'Chemistry'],
                datasets: [{
                    label: 'Mastery Level',
                    data: [90, 70, 85, 60, 75],
                    backgroundColor: 'rgba(16, 185, 129, 0.2)',
                    borderColor: '#10b981',
                }]
            }
        });
    </script>
</body>
</html>
